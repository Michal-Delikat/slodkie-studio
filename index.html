<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Słodkie Studio</title>
        <link rel="icon" type="image/x-icon" href="/img/logo.jpg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ephesis&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="styles.css">
        <script src="index.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="inner-header">
                <a href="#home" class="logo-container">
                    <img src="./img/logo.jpg" alt="Logo Słodkie Studio" class="logo">
                </a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="#about">O nas</a></li>
                        <li><a href="#services">Usługi</a></li>
                        <li><a href="#contact">Kontakt</a></li>
                        <li class="social-media-icons">
                            <a href="https://www.instagram.com/slodkiestudio/" target="_blank" aria-label="Instagram">
                                <i class="fa-brands fa-instagram social-media-icon fa-lg"></i>
                            </a>
                            <a href="https://www.facebook.com/SlodkieStudioGosiPodmostko" target="_blank" aria-label="Facebook">
                                <i class="fa-brands fa-facebook social-media-icon fa-lg"></i>
                            </a>
                        </li>
                    </ul>
                    <button class="menu-toggle" aria-expanded="false">
                        <i class="fa-solid fa-bars" aria-hidden="true"></i>
                        <span class="sr-only">Menu</span>
                    </button>
                </nav>
            </div>
        </header>
        <div class="header-placeholder"></div>
        <main>
            <section id="home" class="section">
                <div class="sub-section">
                    <img src="https://res.cloudinary.com/bmbhnvsi/image/upload/f_auto,q_auto/tort3_xt1mce   " class="hero-image"/>
                </div>
                <div class="sub-section hero-left-column">
                    <h2 class="hero-title">Słodkie Studio</h2>
                    <h3 class="hero-subtitle">Torty o jakich nie śniłeś</h3>
                    <button class="button order-button" type="button">Zamów</button>
                </div>
            </section>
            <section id="about" class="section">
                <h2 class="section-title">O nas</h2>
            </section>
            <section id="services" class="section">
                <h2 class="section-title">Usługi</h2>
            </section>
            <section id="contact" class="section">
                <h2 class="section-title">Kontakt</h2>
            </section>
        </main>
        <footer class="footer">
            <p class="copyright">&copy; 2026 Słodkie Studio</p>
        </footer>
    </body>
</html>
